name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Build with the `windows-debug` preset
        2. Run `HyoshiMetronome.exe`
        3. ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 on M3, Windows 11 with an RTX 4080, Android 15 on a Pixel 8, ...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The CMake preset and compiler version, and the engine commit.
      placeholder: windows-debug, MSVC 19.44, commit abc1234
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The app's console output, or `adb logcat` lines tagged `Hyoshi` on Android.
      render: text
